<svg width="640" height="140" viewBox="0 0 640 140" xmlns="http://www.w3.org/2000/svg">
  <title>B-Sim AI primary horizontal logo</title>

  <!-- Icon mark background -->
  <rect x="0" y="8" width="118" height="118" rx="16" fill="#1E1A2E"/>

  <!-- Circuit dot grid -->
  <circle cx="18" cy="26" r="2.2" fill="#2e2848"/><circle cx="34" cy="26" r="2.2" fill="#2e2848"/><circle cx="50" cy="26" r="2.2" fill="#2e2848"/><circle cx="66" cy="26" r="2.2" fill="#2e2848"/><circle cx="82" cy="26" r="2.2" fill="#2e2848"/><circle cx="98" cy="26" r="2.2" fill="#2e2848"/>
  <circle cx="18" cy="42" r="2.2" fill="#2e2848"/><circle cx="34" cy="42" r="2.2" fill="#2e2848"/><circle cx="50" cy="42" r="2.2" fill="#2e2848"/><circle cx="66" cy="42" r="2.2" fill="#2e2848"/><circle cx="82" cy="42" r="2.2" fill="#2e2848"/><circle cx="98" cy="42" r="2.2" fill="#2e2848"/>
  <circle cx="18" cy="58" r="2.2" fill="#2e2848"/><circle cx="34" cy="58" r="2.2" fill="#2e2848"/><circle cx="50" cy="58" r="2.2" fill="#2e2848"/><circle cx="66" cy="58" r="2.2" fill="#2e2848"/><circle cx="82" cy="58" r="2.2" fill="#2e2848"/><circle cx="98" cy="58" r="2.2" fill="#2e2848"/>
  <circle cx="18" cy="74" r="2.2" fill="#2e2848"/><circle cx="34" cy="74" r="2.2" fill="#2e2848"/><circle cx="50" cy="74" r="2.2" fill="#2e2848"/><circle cx="66" cy="74" r="2.2" fill="#2e2848"/><circle cx="82" cy="74" r="2.2" fill="#2e2848"/><circle cx="98" cy="74" r="2.2" fill="#2e2848"/>
  <circle cx="18" cy="90" r="2.2" fill="#2e2848"/><circle cx="34" cy="90" r="2.2" fill="#2e2848"/><circle cx="50" cy="90" r="2.2" fill="#2e2848"/><circle cx="66" cy="90" r="2.2" fill="#2e2848"/><circle cx="82" cy="90" r="2.2" fill="#2e2848"/><circle cx="98" cy="90" r="2.2" fill="#2e2848"/>
  <circle cx="18" cy="106" r="2.2" fill="#2e2848"/><circle cx="34" cy="106" r="2.2" fill="#2e2848"/><circle cx="50" cy="106" r="2.2" fill="#2e2848"/><circle cx="66" cy="106" r="2.2" fill="#2e2848"/><circle cx="82" cy="106" r="2.2" fill="#2e2848"/><circle cx="98" cy="106" r="2.2" fill="#2e2848"/>

  <!-- Rising bars: tan, terracotta, rust, gold -->
  <rect x="10" y="96" width="18" height="26" rx="3" fill="#9E7B5A"/>
  <rect x="33" y="78" width="18" height="44" rx="3" fill="#C4622D"/>
  <rect x="56" y="58" width="18" height="64" rx="3" fill="#8B3A1A"/>
  <rect x="79" y="34" width="18" height="88" rx="3" fill="#D4A847"/>

  <!-- Trend line -->
  <polyline points="19,96 42,78 65,58 88,34" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

  <!-- AI peak node -->
  <circle cx="88" cy="34" r="7" fill="#D4A847" stroke="#ffffff" stroke-width="2"/>
  <circle cx="88" cy="34" r="13" fill="none" stroke="#D4A847" stroke-width="1.2" opacity="0.38"/>

  <!-- Wordmark -->
  <text x="142" y="76" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1" fill="#1E1A2E">B-Sim</text>
  <text x="358" y="76" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="52" font-weight="200" letter-spacing="2" fill="#C4622D"> AI</text>

  <!-- Gold accent rule -->
  <rect x="142" y="88" width="44" height="3" rx="1.5" fill="#D4A847"/>

  <!-- Tagline -->
  <text x="142" y="112" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" letter-spacing="4.5" fill="#9E7B5A">BUSINESS SIMULATION PLATFORM</text>
</svg>
