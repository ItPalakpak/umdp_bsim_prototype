<svg width="360" height="400" viewBox="0 0 360 400" xmlns="http://www.w3.org/2000/svg">
  <title>B-Sim AI stacked logo</title>

  <!-- Icon mark -->
  <rect x="100" y="20" width="160" height="160" rx="24" fill="#1E1A2E"/>

  <!-- Grid dots -->
  <circle cx="122" cy="44" r="2.8" fill="#2e2848"/><circle cx="146" cy="44" r="2.8" fill="#2e2848"/><circle cx="170" cy="44" r="2.8" fill="#2e2848"/><circle cx="194" cy="44" r="2.8" fill="#2e2848"/><circle cx="218" cy="44" r="2.8" fill="#2e2848"/>
  <circle cx="122" cy="68" r="2.8" fill="#2e2848"/><circle cx="146" cy="68" r="2.8" fill="#2e2848"/><circle cx="170" cy="68" r="2.8" fill="#2e2848"/><circle cx="194" cy="68" r="2.8" fill="#2e2848"/><circle cx="218" cy="68" r="2.8" fill="#2e2848"/>
  <circle cx="122" cy="92" r="2.8" fill="#2e2848"/><circle cx="146" cy="92" r="2.8" fill="#2e2848"/><circle cx="170" cy="92" r="2.8" fill="#2e2848"/><circle cx="194" cy="92" r="2.8" fill="#2e2848"/><circle cx="218" cy="92" r="2.8" fill="#2e2848"/>
  <circle cx="122" cy="116" r="2.8" fill="#2e2848"/><circle cx="146" cy="116" r="2.8" fill="#2e2848"/><circle cx="170" cy="116" r="2.8" fill="#2e2848"/><circle cx="194" cy="116" r="2.8" fill="#2e2848"/><circle cx="218" cy="116" r="2.8" fill="#2e2848"/>
  <circle cx="122" cy="140" r="2.8" fill="#2e2848"/><circle cx="146" cy="140" r="2.8" fill="#2e2848"/><circle cx="170" cy="140" r="2.8" fill="#2e2848"/><circle cx="194" cy="140" r="2.8" fill="#2e2848"/><circle cx="218" cy="140" r="2.8" fill="#2e2848"/>
  <circle cx="122" cy="164" r="2.8" fill="#2e2848"/><circle cx="146" cy="164" r="2.8" fill="#2e2848"/><circle cx="170" cy="164" r="2.8" fill="#2e2848"/><circle cx="194" cy="164" r="2.8" fill="#2e2848"/><circle cx="218" cy="164" r="2.8" fill="#2e2848"/>

  <!-- Rising bars -->
  <rect x="112" y="140" width="26" height="38" rx="4" fill="#9E7B5A"/>
  <rect x="144" y="116" width="26" height="62" rx="4" fill="#C4622D"/>
  <rect x="176" y="88" width="26" height="90" rx="4" fill="#8B3A1A"/>
  <rect x="208" y="54" width="26" height="124" rx="4" fill="#D4A847"/>

  <!-- Trend line -->
  <polyline points="125,140 157,116 189,88 221,54" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

  <!-- Peak node -->
  <circle cx="221" cy="54" r="10" fill="#D4A847" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="221" cy="54" r="18" fill="none" stroke="#D4A847" stroke-width="1.5" opacity="0.38"/>

  <!-- Wordmark stacked -->
  <text x="180" y="242" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#1E1A2E">B-Sim</text>
  <text x="180" y="298" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="200" letter-spacing="14" fill="#C4622D">AI</text>

  <!-- Divider -->
  <rect x="124" y="252" width="112" height="3" rx="1.5" fill="#D4A847"/>

  <!-- Tagline -->
  <text x="180" y="348" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" letter-spacing="4" fill="#9E7B5A">BUSINESS SIMULATION</text>
  <text x="180" y="372" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" letter-spacing="4" fill="#9E7B5A">PLATFORM</text>
